# Railway config-as-code for the WORKER service (ten-ventures fork).
# The web app runs on Vercel; this service is `npm run worker` only.
# Build = prisma generate (no next build, no migrate — the worker can't reach
# Postgres at build time; migrations run from the web app's vercel-build or by hand).
[build]
builder = "RAILPACK"
buildCommand = "npm run db:generate"

[deploy]
startCommand = "npm run worker"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
